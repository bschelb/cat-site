<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Cats</title>
<style>
  :root { --bg:#fbf6ef; --ink:#2b2320; --muted:#8a7b70; --accent:#e8743b; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1816; --ink:#f4ece4; --muted:#a39488; --card:#262120; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  .gate { min-height:100vh; display:grid; place-content:center; text-align:center; gap:14px; padding:24px; }
  .gate .paw { font-size:64px; }
  h1 { margin:0; font-size:2rem; }
  input, button { font:inherit; padding:12px 16px; border-radius:12px; border:2px solid var(--muted); background:var(--card); color:var(--ink); }
  button { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  #err { color:#d33; min-height:1.5em; margin:0; }
  header { text-align:center; padding:40px 16px 8px; }
  header p { color:var(--muted); margin:4px 0 0; }
  .grid { columns:3 260px; column-gap:16px; max-width:1100px; margin:24px auto 60px; padding:0 16px; }
  figure { break-inside:avoid; margin:0 0 16px; background:var(--card); border-radius:18px; overflow:hidden; position:relative; box-shadow:0 4px 14px #0002; }
  figure img { width:100%; display:block; }
  figure span { position:absolute; top:10px; left:10px; background:var(--accent); color:#fff; font-weight:700; border-radius:999px; min-width:32px; height:32px; display:grid; place-content:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<form class="gate" id="gate">
  <div class="paw">🐾</div>
  <h1>Daily Cats</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
  <button>Let me in</button>
  <p id="err" role="alert"></p>
</form>
<main id="app" hidden>
  <header><h1>🐱 Today's Top 10 Cats</h1><p id="date"></p></header>
  <div class="grid" id="grid"></div>
</main>
<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw, d) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(d.salt), iterations:310000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(d.iv) }, key, b64(d.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function show({ date, cats }) {
  document.getElementById('date').textContent = new Date(date + 'T12:00').toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  document.getElementById('grid').innerHTML = cats.map((c, i) =>
    `<figure><span>${i + 1}</span><img loading="lazy" src="${c.url}" alt="Cat #${i + 1}"></figure>`).join('');
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
}
document.getElementById('gate').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const d = await (await fetch('data.json', { cache:'no-store' })).json();
    show(await decrypt(document.getElementById('pw').value, d));
  } catch { err.textContent = 'Wrong password 🙀'; }
});
</script>
</body>
</html>
